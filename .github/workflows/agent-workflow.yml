name: agent-workflow
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: agent-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/agent_workflow.py check
      - run: python3 tools/test_agent_workflow.py
