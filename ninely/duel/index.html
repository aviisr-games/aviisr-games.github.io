<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ninely - Sudoku Challenge & Duel</title>
<meta name="description" content="A friend challenged you to a Ninely Sudoku board. Beat their time in your browser or in the app!">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self';">
<link rel="stylesheet" href="../../style.css">
<style>
  .duel-container { max-width: 520px; margin: 0 auto; text-align: center; }
  .duel-badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 6px 14px; border-radius: 999px; font-weight: 700; margin-bottom: 12px; }
  .timer-box { font-size: 1.5rem; font-weight: bold; margin: 10px 0; color: var(--gold); }
  .sudoku-board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: #334155; border: 3px solid #0f172a; border-radius: 8px; margin: 16px auto; max-width: 360px; aspect-ratio: 1; padding: 2px; }
  .sudoku-cell { background: #1e293b; color: #f8fafc; font-size: 1.25rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: background 0.15s; }
  .sudoku-cell:hover { background: #334155; }
  .sudoku-cell.selected { background: #0284c7; color: #fff; }
  .sudoku-cell.fixed { background: #0f172a; color: #94a3b8; cursor: default; }
  .sudoku-cell.hinted { background: #f59e0b; color: #000; }
  .sudoku-cell.conflict { background: #dc2626; color: #fff; }
  .sudoku-cell:nth-child(3n) { border-right: 2px solid #64748b; }
  .sudoku-cell:nth-child(9n) { border-right: none; }
  .sudoku-cell:nth-child(n+19):nth-child(-n+27),
  .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #64748b; }
  .numpad { display: flex; justify-content: center; gap: 6px; margin: 14px auto; flex-wrap: wrap; max-width: 360px; }
  .num-btn { background: #334155; color: #fff; border: 1px solid #475569; border-radius: 6px; font-size: 1.15rem; font-weight: bold; padding: 10px 14px; cursor: pointer; min-width: 34px; }
  .num-btn:hover { background: #0284c7; }
  .action-btn { background: #f59e0b; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; padding: 10px 18px; cursor: pointer; margin: 6px 4px; }
  .action-btn:hover { opacity: 0.9; }
  .hint-box { background: rgba(15, 23, 42, 0.7); border: 1px solid #38bdf8; border-radius: 8px; padding: 12px; margin: 14px 0; font-size: 0.95rem; text-align: left; display: none; }
  [dir="rtl"] .hint-box { text-align: right; }
  .store-links { margin-top: 20px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .store-btn { display: inline-block; background: #000; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: bold; text-decoration: none; border: 1px solid #334155; }
  .store-btn:hover { background: #1e293b; text-decoration: none; }
</style>
</head>
<body>
<main>
<nav class="lang"><a href="../">Ninely</a> <a href="../../">All Games</a></nav>

<div class="duel-container">
  <div class="duel-badge" data-i18n="badge">Ninely Friend Challenge</div>
  <h1 data-i18n="title">Ninely Sudoku Duel</h1>
  <p class="sub" data-i18n="sub">A friend challenged you to beat their Sudoku time. Play right here or launch the app!</p>
  
  <p id="info" style="font-weight: bold; color: var(--gold);"></p>
  
  <div style="margin: 12px 0;">
    <a id="open" class="store-btn" style="background: #0284c7;" href="#">⚡ <span data-i18n="openApp">Open in Ninely App</span></a>
  </div>

  <div class="card" style="padding: 16px;">
    <div class="timer-box">⏱️ <span id="game-timer">00:00</span></div>
    <div id="board" class="sudoku-board"></div>
    
    <div class="numpad">
      <button type="button" class="num-btn" data-val="1">1</button>
      <button type="button" class="num-btn" data-val="2">2</button>
      <button type="button" class="num-btn" data-val="3">3</button>
      <button type="button" class="num-btn" data-val="4">4</button>
      <button type="button" class="num-btn" data-val="5">5</button>
      <button type="button" class="num-btn" data-val="6">6</button>
      <button type="button" class="num-btn" data-val="7">7</button>
      <button type="button" class="num-btn" data-val="8">8</button>
      <button type="button" class="num-btn" data-val="9">9</button>
      <button type="button" class="num-btn" data-val="0" title="Erase" data-i18n="erase">⌫</button>
    </div>

    <div>
      <button type="button" id="hint-btn" class="action-btn">💡 <span data-i18n="smartHint">Smart Hint</span></button>
      <button type="button" id="restart-btn" class="action-btn" style="background: #475569; color:#fff;" data-i18n="restart">↺ Restart</button>
    </div>

    <div id="hint-box" class="hint-box"></div>
    <div id="win-box" style="display: none; margin-top: 14px; padding: 14px; background: #065f46; color: #fff; border-radius: 8px; font-weight: bold;">
      🎉 <span data-i18n="won">Board Cleared!</span> <span id="win-time"></span>
    </div>
  </div>

  <div class="store-links">
    <a class="store-btn" href="https://play.google.com/store/apps/details?id=com.aviisrgames.ninely" target="_blank" rel="noopener noreferrer noreferrer">Google Play</a>
    <a class="store-btn" href="https://apps.apple.com/app/id6824055538" target="_blank" rel="noopener noreferrer noreferrer">App Store</a>
  </div>
</div>

<footer>
  <a href="../">Ninely</a> · <a href="../privacy.html">Privacy</a> · <a href="mailto:aviisr@aviisrgames.com">Support</a>
</footer>
</main>

<script src="../../assets/i18n.js"></script>
<script>
(function () {
  'use strict';

  var translations = {
    en: {
      badge: "Ninely Friend Challenge",
      title: "Ninely Sudoku Duel",
      sub: "A friend challenged you to beat their Sudoku time. Play right here or launch the app!",
      openApp: "Open in Ninely App",
      smartHint: "Smart Hint",
      restart: "↺ Restart",
      erase: "⌫",
      won: "Board Cleared!"
    },
    he: {
      badge: "אתגר חברים Ninely",
      title: "דו-קרב סודוקו ב-Ninely",
      sub: "חבר אתגר אותך לנצח את הזמן שלו! אפשר לשחק כאן בדפדפן או לפתוח באפליקציה:",
      openApp: "פתיחה באפליקציית Ninely",
      smartHint: "רמז חכם",
      restart: "↺ התחלה מחדש",
      erase: "⌫ מחק",
      won: "הלוח הושלם בהצלחה!"
    },
    ar: {
      badge: "تحدي الأصدقاء Ninely",
      title: "تحدي سودوكو في Ninely",
      sub: "صديقك يتحداك في لوح سودوكو! العب هنا في المتصفح أو افتح التطبيق مباشرة:",
      openApp: "فتح في تطبيق Ninely",
      smartHint: "تلميح ذكي",
      restart: "↺ إعادة البدء",
      erase: "⌫ مسح",
      won: "تم حل اللوح بنجاح!"
    }
  };

  AviisrI18n.init({
    supported: ['en', 'he', 'ar', 'ja', 'ko', 'de', 'fr', 'nl', 'es', 'pt-BR', 'zh-TW', 'zh-CN', 'it', 'ru', 'sv', 'da', 'nb', 'fi'],
    translations: translations,
    defaultLang: 'en'
  });

  var q = new URLSearchParams(window.location.search);
  var s = q.get('s') || '20261108';
  var d = q.get('d') || '1';
  var t = q.get('t') || '180';

  if (!/^\d{1,10}$/.test(s)) s = '20261108';
  if (!/^[0-4]$/.test(d)) d = '1';
  if (!/^\d{1,6}$/.test(t)) t = '180';

  var diffNames = ['Easy', 'Medium', 'Hard', 'Expert', 'Master'];
  var targetSecs = parseInt(t, 10);
  var tMin = Math.floor(targetSecs / 60), tSec = targetSecs % 60;
  var infoEl = document.getElementById('info');
  infoEl.textContent = diffNames[+d] + ' Board · Time to beat: ' + tMin + ':' + (tSec < 10 ? '0' : '') + tSec;

  var appUrl = 'ninely://duel?s=' + encodeURIComponent(s) + '&d=' + encodeURIComponent(d) + '&t=' + encodeURIComponent(t);
  var openBtn = document.getElementById('open');
  if (openBtn) openBtn.href = appUrl;

  if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    setTimeout(function () { window.location.href = appUrl; }, 400);
  }

  function Mulberry32(seed) {
    return function() {
      var t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var rng = Mulberry32(parseInt(s, 10) || 12345);

  var baseSolution = [
    5,3,4,6,7,8,9,1,2,
    6,7,2,1,9,5,3,4,8,
    1,9,8,3,4,2,5,6,7,
    8,5,9,7,6,1,4,2,3,
    4,2,6,8,5,3,7,9,1,
    7,1,3,9,2,4,8,5,6,
    9,6,1,5,3,7,2,8,4,
    2,8,7,4,1,9,6,3,5,
    3,4,5,2,8,6,1,7,9
  ];

  var holesCount = [32, 40, 46, 52, 56][+d];
  var puzzle = baseSolution.slice();
  var indices = [];
  for (var i = 0; i < 81; i++) indices.push(i);
  for (var k = indices.length - 1; k > 0; k--) {
    var j = Math.floor(rng() * (k + 1));
    var tmp = indices[k]; indices[k] = indices[j]; indices[j] = tmp;
  }
  for (var r = 0; r < holesCount; r++) {
    puzzle[indices[r]] = 0;
  }

  var currentBoard = puzzle.slice();
  var selectedCell = -1;
  var boardEl = document.getElementById('board');
  var cells = [];

  function renderBoard() {
    boardEl.replaceChildren();
    cells = [];
    for (var idx = 0; idx < 81; idx++) {
      var cell = document.createElement('div');
      cell.className = 'sudoku-cell';
      if (puzzle[idx] !== 0) {
        cell.classList.add('fixed');
        cell.textContent = String(puzzle[idx]);
      } else if (currentBoard[idx] !== 0) {
        cell.textContent = String(currentBoard[idx]);
      }
      cell.setAttribute('data-idx', idx);
      cell.addEventListener('click', onCellClick);
      boardEl.appendChild(cell);
      cells.push(cell);
    }
  }

  function onCellClick() {
    var idx = parseInt(this.getAttribute('data-idx'), 10);
    if (puzzle[idx] !== 0) return;
    if (selectedCell !== -1 && cells[selectedCell]) {
      cells[selectedCell].classList.remove('selected');
    }
    selectedCell = idx;
    this.classList.add('selected');
  }

  function handleNumInput(val) {
    if (selectedCell === -1 || puzzle[selectedCell] !== 0) return;
    currentBoard[selectedCell] = val;
    cells[selectedCell].textContent = val === 0 ? '' : String(val);
    cells[selectedCell].classList.remove('hinted');

    if (val !== 0 && val !== baseSolution[selectedCell]) {
      cells[selectedCell].classList.add('conflict');
    } else {
      cells[selectedCell].classList.remove('conflict');
    }

    checkWin();
  }

  document.querySelectorAll('.num-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var v = parseInt(this.getAttribute('data-val'), 10);
      handleNumInput(v);
    });
  });

  window.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '9') {
      handleNumInput(parseInt(e.key, 10));
    } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
      handleNumInput(0);
    }
  });

  var secondsElapsed = 0;
  var timerInterval = setInterval(function () {
    secondsElapsed++;
    var m = Math.floor(secondsElapsed / 60), s = secondsElapsed % 60;
    var timerDisplay = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    var timerEl = document.getElementById('game-timer');
    if (timerEl) timerEl.textContent = timerDisplay;
  }, 1000);

  function checkWin() {
    for (var c = 0; c < 81; c++) {
      if (currentBoard[c] !== baseSolution[c]) return;
    }
    clearInterval(timerInterval);
    var winBox = document.getElementById('win-box');
    var winTime = document.getElementById('win-time');
    var m = Math.floor(secondsElapsed / 60), s = secondsElapsed % 60;
    var timeStr = m + 'm ' + s + 's';
    if (winTime) {
      winTime.textContent = timeStr + (secondsElapsed < targetSecs ? ' — ⚡ You beat your friend\'s time!' : ' — Solved!');
    }
    if (winBox) winBox.style.display = 'block';
  }

  document.getElementById('hint-btn').addEventListener('click', function () {
    var hintBox = document.getElementById('hint-box');
    for (var i = 0; i < 81; i++) {
      if (currentBoard[i] !== baseSolution[i]) {
        var correctVal = baseSolution[i];
        var row = Math.floor(i / 9) + 1;
        var col = (i % 9) + 1;
        if (cells[i]) {
          cells[i].classList.add('hinted');
          cells[i].classList.remove('conflict');
          cells[i].textContent = String(correctVal);
          currentBoard[i] = correctVal;
        }
        hintBox.style.display = 'block';
        hintBox.textContent = 'Smart Hint: Row ' + row + ', Column ' + col + ' must be ' + correctVal + ' because no other number fits that row/column/box. (Ninely teaches advanced techniques like Naked Singles, Hidden Pairs, and X-Wings in the full app!)';
        checkWin();
        return;
      }
    }
  });

  document.getElementById('restart-btn').addEventListener('click', function () {
    currentBoard = puzzle.slice();
    renderBoard();
    var hintBox = document.getElementById('hint-box');
    if (hintBox) hintBox.style.display = 'none';
    var winBox = document.getElementById('win-box');
    if (winBox) winBox.style.display = 'none';
  });

  renderBoard();
})();
</script>
</body>
</html>
