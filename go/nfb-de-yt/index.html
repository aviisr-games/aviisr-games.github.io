<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="2; url=https://www.facebook.com/groups/sudokutechnikenlernen">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.goatcounter.com; object-src 'none'; base-uri 'self';">
  <title>Weiterleitung zu Sudoku-Techniken lernen</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #14181f;
      --muted: #525d6d;
      --accent: #0f62fe;
      --accent-text: #ffffff;
      --border: #dce1e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f131a;
        --card: #171d27;
        --text: #f0f3f7;
        --muted: #a6b0bf;
        --accent: #4589ff;
        --accent-text: #0b1018;
        --border: #2a3342;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      line-height: 1.35;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .cta {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .brand {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Weiterleitung zur Ninely-Sudoku-Gruppe auf Facebook</h1>
    <p>Sudoku-Techniken lernen ist eine öffentliche Facebook-Gruppe, geleitet vom alleinigen Entwickler von Ninely bei aviisr games. Die App brauchen Sie nicht, um mitzumachen.</p>
    <a class="cta" href="https://www.facebook.com/groups/sudokutechnikenlernen" rel="noopener noreferrer">Weiter zur Gruppe</a>
    <p class="brand">aviisr games</p>
  </main>
  <script src="/assets/count.js" defer></script>
  <script>
    setTimeout(function () {
      window.location.replace("https://www.facebook.com/groups/sudokutechnikenlernen");
    }, 2000);
  </script>
</body>
</html>
