name: store-links-and-names
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '**.html'
      - 'tools/check_store_links.py'
      - 'tools/check_store_listings.py'
      - 'tools/check_pack_runway.py'
      - 'ninely/play/daily-pack.json'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_store_links.py
      - run: python3 tools/check_store_listings.py
      - run: python3 tools/check_pack_runway.py
