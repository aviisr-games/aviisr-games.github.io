<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="no-referrer">
  <title>Opening Baylight: Truck Sort Puzzle on Google Play…</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #14181f;
      --muted: #525d6d;
      --accent: #0f62fe;
      --accent-text: #ffffff;
      --border: #dce1e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f131a;
        --card: #171d27;
        --text: #f0f3f7;
        --muted: #a6b0bf;
        --accent: #4589ff;
        --accent-text: #0b1018;
        --border: #2a3342;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.2rem;
      line-height: 1.35;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .cta {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .brand {
      margin-top: 18px;
      margin-bottom: 0;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>

    </noscript>
    <p class="brand">aviisr games</p>
  </main>
  <script>
    (function () {
      'use strict';
      var TARGET = "https://play.google.com/store/apps/details?id=com.aviisrgames.baylight&referrer=utm_source%3Dtiktok%26utm_medium%3Dorganic%26utm_campaign%3Dbaylight-w03";
      var ENDPOINT = "https://aviisrgames.goatcounter.com/count";
      var dnt = navigator.doNotTrack === '1' || window.doNotTrack === '1' || navigator.globalPrivacyControl === true;
      if (!dnt) {
        try {
          var url = ENDPOINT + '?p=' + encodeURIComponent("go/baylight-tiktok-w03") + '&e=true&rnd=' + Math.random().toString(36).slice(2);
          if (typeof navigator.sendBeacon === 'function') {
            navigator.sendBeacon(url);

            fetch(url, { mode: 'no-cors', keepalive: true, credentials: 'omit', referrerPolicy: 'no-referrer' }).catch(function () {});

      setTimeout(function () {
        window.location.replace(TARGET);
      }, 300);
    })();
  </script>
</body>
